<div id="app" class="app" hidden>
  <canvas id="map" class="map" aria-label="Mapa hexagonal"></canvas>

  <header class="topbar">
    <button class="icon-btn" id="btnMenu" aria-label="Menu"><svg><use href="#i-menu"/></svg></button>
    <div class="tb-place">
      <span class="tb-region" id="tbRegion">—</span>
      <span class="tb-sub" id="tbSub">—</span>
    </div>
    <div class="tb-time">
      <span class="tb-season" id="tbSeason">Primavera</span>
      <span class="tb-turn" id="tbTurn">Turno 1</span>
    </div>
    <div class="tb-res" id="tbRes" title="Reservas iniciais — a produção por turnos chega na Fase 2"></div>
  </header>

  <aside class="panel" id="panel" aria-live="polite" hidden></aside>

  <div class="mapctl" id="mapctl">
    <button class="icon-btn" data-ctl="in" aria-label="Aproximar"><svg><use href="#i-plus"/></svg></button>
    <button class="icon-btn" data-ctl="out" aria-label="Afastar"><svg><use href="#i-minus"/></svg></button>
    <button class="icon-btn" data-ctl="home" aria-label="Centrar na aldeia"><svg><use href="#i-home"/></svg></button>
    <button class="icon-btn" data-ctl="fit" aria-label="Ver o mapa todo"><svg><use href="#i-fit"/></svg></button>
    <button class="icon-btn" data-ctl="fog" aria-label="Névoa de guerra" aria-pressed="true"><svg><use href="#i-eye"/></svg></button>
    <button class="icon-btn sound-btn" data-ctl="sound" aria-label="Som"><svg><use href="#i-sound"/></svg></button>
  </div>

  <div class="hint" id="hint" hidden></div>
  <div class="banner" id="banner" hidden></div>
  <section class="dock" id="dock" aria-label="Exploradores e ações"></section>

  <div class="toasts" id="toasts" aria-live="polite"></div>
</div>

<section class="screen menu" id="menu" hidden>
  <button class="icon-btn sound-btn menu-sound" id="mSound" aria-label="Som"><svg><use href="#i-sound"/></svg></button>
  <div class="menu-inner">
    <div class="menu-tiles" id="menuTiles" aria-hidden="true"></div>
    <h1 class="title">Frontier</h1>
    <p class="subtitle">Realms of the Unknown</p>
    <nav class="menu-list">
      <button class="btn primary" id="mContinue">Continuar campanha</button>
      <button class="btn" id="mNewCampaign">Campanhas</button>
      <button class="btn" id="mExpedition">Expeditions</button>
      <div class="menu-row">
        <button class="btn small" id="mRecords">Recordes</button>
        <button class="btn small" id="mOptions">Opções</button>
        <button class="btn small" id="mHelp">Como jogar</button>
        <button class="btn small" id="mCredits">Créditos</button>
      </div>
    </nav>
    <p class="menu-foot" id="menuFoot"></p>
  </div>
</section>

<div class="modal" id="modal" hidden><div class="modal-card" id="modalCard" role="dialog" aria-modal="true"></div></div>

<div class="loading" id="loading">
  <p class="title small">Frontier</p>
  <div class="bar"><span id="loadBar"></span></div>
  <p class="loading-text" id="loadText">A desenrolar o mapa…</p>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
